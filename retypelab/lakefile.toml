name = "retypelab"
reservoir = false
version = "0.1.0"
defaultTargets = ["RetypeLab"]

# Second sidecar.  The toolchain split that forced it is GONE as of the
# v4.32.1 bump — root, `proofs/` and this package are all on v4.32.1 now, so
# `require sparkle` would work and the ℝ model need not be duplicated.
#
# Folding this into `proofs/` is the obvious follow-up and is deliberately NOT
# done in the same commit as the bump: merging the two mathlib copies and
# de-duplicating the model is a separate change with its own failure modes,
# and keeping the bump reviewable matters more than landing both at once.
[[require]]
name = "retype"
git = "https://github.com/Verilean/retype"
rev = "main"

# mathlib — still a SECOND copy, distinct from the one `proofs/` uses.  No
# longer unavoidable (same toolchain now); it is what the pending fold into
# `proofs/` removes.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0"

[[lean_lib]]
name = "RetypeLab"
