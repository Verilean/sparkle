name: IP Tests

# Per-IP simulation tests for the full IP suite.  Each IP runs
# in its own matrix shard so:
#   - failures are scoped (you know which IP broke)
#   - the wall-clock stays inside ~1 hour even for heavy sims
#   - DSL / Compiler changes break IP simulation visibly in CI
#
# The matrix covers ALL `lean_exe` test targets in lakefile.lean,
# except for:
#   - `sparkle*` CLI binaries (not tests)
#   - `tutorial-*` (covered by build.yml docs path)
#   - `*-trace` debug-only drivers
#   - `bitnet-mmio-probe` / `probe-ghash` (one-shot diagnostics)
#   - `bitnet-linux-test` (covered by bitnet-linux.yml, ~30 min)
#   - `test` = AllTests (covered by build.yml as the release gate)
#   - `verilog-tests`, `iverilog-roundtrip-test` (in build.yml)
#   - `generate-verify` (codegen utility)
#   - `rv32-jit-linux-boot-test` (long boot; manual only)
#   - `sim-cost` (demo, run on demand)
#
# IPs that are known to currently fail/hang are marked
# `continue-on-error: true` so they don't block the wall — they
# still show as failed in the matrix UI for visibility, but a
# downstream "all green" gate isn't held back by them while we
# fix the underlying issues.

on:
  push:
    branches: [ main, master, 'feat/**', 'feature/**' ]
    paths:
      - 'IP/**'
      - 'Sparkle/**'
      - 'Tests/**'
      - 'Examples/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/ip-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'IP/**'
      - 'Sparkle/**'
      - 'Tests/**'
      - 'Examples/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/ip-tests.yml'
  workflow_dispatch:

jobs:
  ip-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      # Keep going even if one IP breaks — see all failures at once.
      fail-fast: false
      matrix:
        # One entry per IP test executable.  Grouped by topic.
        exe:
          # --- Core DSL / runtime sanity ---
          - signal-loop-test
          - circuit-do-test
          - circuit-sim-test
          - run-circuit-h-test
          - sim-runner-test
          - cdc-multi-clock-test
          - svparser-test

          # --- Bus IPs ---
          - pcie-test
          - pcie-hft-test
          - can-test
          - can-hw-test
          - canopen-test
          - dronecan-test
          - serial-bus-test
          - avionics-bus-test

          # --- Ethernet stack ---
          - crc32-test
          - ethernet-test
          - ethernet-tx-test
          - arp-test
          - ipv4-test
          - icmp-test
          - tcp-header-test
          - tcp-state-test
          - tcp-loopback-test
          - http-test
          - hft-strategy-test

          # --- USB Web server stack ---
          - uart-test
          - slip-test
          - usb-webserver-sim

          # --- memcached server ---
          - memcached-oracle-test
          - memcached-hw-test
          - memcached-server-test

          # --- Crypto ---
          - sha256-test
          - sha512-check
          - aes-test
          - aes-gcm-test
          - ghash-test
          - ghash-hw-test
          - hkdf-test
          - x25519-test
          - ed25519-field-test
          - ed25519-point-test
          - ed25519-sign-test
          - ed25519-verify-test
          - p256-ecdsa-test
          - rsa-pss-test
          - secp256k1-test

          # --- ZK / accelerator primitives ---
          - goldilocks-test
          - merkle-test
          - polynomial-test
          - mini-stark-test

          # --- TLS 1.3 ---
          - tls-keysched-test
          - tls-x509-test
          - x509-parser-test
          - x509-verify-test
          - tls-client-fsm-test
          - tls-client-server-test

          # --- HFT / HTTPS ---
          - hft-over-tls-test
          - https-demo

          # --- Video (H.264) ---
          - h264-bitstream-test
          - h264-jit-test
          - h264-jit-pipeline-test
          - h264-frame-encoder-test
          - h264-mp4-encoder-test
          - h264-playable-test

          # --- RV32 core + JIT ---
          - rv32-flow-test
          - rv32-jit-test
          - rv32-jit-loop-test
          - rv32-jit-oracle-test
          - rv32-jit-boot-oracle-test
          - rv32-jit-cycle-skip-test
          - rv32-jit-dynamic-warp-test
          - rv32-jit-speculative-warp-test
          - rv32-lean-sim-runner
          - mext-rv32i-test
          - mul-oracle-test
          - oracle-accuracy-test
          - timemux-sim-test
          - toplevel-sim-test
          - verilog-sim-le

          # --- BitNet SoC integration ---
          - bitnet-soc-test
          - ffn-golden-test
          - golden-compare-test

          # --- Drone / closed-loop ---
          - drone-closed-loop-test

          # --- LiteX integration ---
          - litex-test

    steps:
      - uses: actions/checkout@v4

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Resolve Lean toolchain
        run: elan default $(cat lean-toolchain)

      - name: Cache Lake build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages
          key: lake-build-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-

      - name: Build IP test ${{ matrix.exe }}
        run: lake build «${{ matrix.exe }}»
        timeout-minutes: 30

      - name: Run IP test ${{ matrix.exe }}
        run: lake exe ${{ matrix.exe }}
        timeout-minutes: 25
