name: VED (verify_elab_deep)

# Regression for `#verify_elab_deep` and the strict axiom audit
# (docs/VED-MAIN-INTRO.md).  These lean_lib targets are NOT default targets, so the
# plain `lake build` of build.yml does not build them.
#
# * `ved-pr`   — the representative regression, on pull requests that touch
#   the compiler, the VED tools or their tests.
# * `ved-full` — every VED regression file, on a schedule and on demand
#   (the release / periodic gate; the per-IP release measurement is a
#   separate gate, see the doc).

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Sparkle.lean'
      - 'Sparkle/**'
      - 'Tools/DeepElab.lean'
      - 'Tools/VerifyElab.lean'
      - 'Tools/ConeFold*.lean'
      - 'Tools/ConcatNorm.lean'
      - 'Tools/SVParser/**'
      - 'Tools/VedStrictAudit.lean'
      - 'Tools/VedU1*.lean'
      - 'Tools/VedU2*.lean'
      - 'Tools/VedIRDecEq.lean'
      - 'Tests/Verification/**'
      - 'Tests/Ved/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/ved.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ved-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Install Lean toolchain
      run: elan default $(cat lean-toolchain)

    - name: Strict axiom audit (accept / reject controls)
      run: lake build Tests.Ved.StrictAuditCheck

    - name: Synthesis-path regressions (width-aware merging, per-module caches)
      run: lake build Tests.Ved.RegDedupWidthCheck Tests.Ved.NestedCacheCheck

    - name: U1 strict entry (contract, entry, deep route; accept and refuse controls)
      run: lake build Tests.Ved.U1ContractCheck Tests.Ved.U1EntryCheck Tests.Ved.U1DeepCheck Tests.Ved.U1DomainCheck Tests.Ved.U1MultiOutCheck Tests.Ved.U1PackedCheck Tests.Ved.U1EqLutCheck Tests.Ved.U1StageCheck Tests.Ved.U1HierCheck Tests.Ved.U1MultiRegCheck Tests.Ved.DeepNameCheck Tests.Ved.DeepInitCheck Tests.Ved.DeepHygieneCheck Tests.Ved.U1LeafCheck

    - name: U1 on a real IP leaf (rconHW, representative, heavier)
      run: lake build Tests.Ved.U1RconCheck

    - name: H2 stateful hierarchy (semantics, open parent, H2a entry, H2b parent registers; accept and refuse controls)
      run: lake build Tests.Ved.U2HierSemCheck Tests.Ved.H2OpenParentProbe Tests.Ved.U2HierCheck Tests.Ved.U2HierRegCheck Tests.Ved.U2HierWireCheck Tests.Ved.U2HierPin

    - name: "H2c-state (a child call on the parent's register state): copies, controls"
      run: lake build Tests.Ved.U2HierStateCallCheck

    - name: "H2c-state: partial generation of the open parent's deep facts (recorded, or refused); controls"
      run: lake build Tests.Ved.U2HierPartialDeepCheck

    - name: "H2c-state: the ORIGINAL private declaration synth_httpGetByte (R223), the entry appended to its module"
      run: |
        lake build Tools.VedU2HierRegEntry IP.Net.HTTP
        sed -e 's/^import Sparkle$/import Sparkle\nimport Tools.VedU2HierRegEntry/' -e 's/^#synthesizeVerilog synth_httpGetByte$/#synthesizeVerilog synth_httpGetByte\nset_option maxRecDepth 100000\n#ved_u2_hier synth_httpGetByte/' Tests/IP/Net/HTTPTest.lean > "$RUNNER_TEMP/HTTPTestReal.lean"
        lake env lean "$RUNNER_TEMP/HTTPTestReal.lean" 2>&1 | tee "$RUNNER_TEMP/real.out"
        grep -q "VED U2 HIER OK" "$RUNNER_TEMP/real.out"

    - name: U1 on a real IP leaf (keccakRcHW, 32 x 64-bit constants)
      run: lake build Tests.Ved.U1KeccakRcCheck

    - name: U1 on real IP with == and wide inputs (aluSignal, hazardSignal, lqrCtrlTop, canopenIsNmt, droneCanNodeFilter)
      run: lake build Tests.Ved.U1EqWideCheck

    - name: "U1 on the real constant tables (SHA-256 / SHA-512 K, AES S-box: 64 / 80 / 256 entries)"
      run: lake build Tests.Ved.U1KTabCheck

    - name: "U1 on real IP with several Signal.loop registers: 3 representative rows and refusal controls"
      run: lake build Tests.Ved.U1MultiLoopCheck

    - name: Deep route, representative regression
      run: lake build Tests.Verification.ValueParamInitRepro Tests.Verification.ConeSharingGen Tests.Verification.DeepElabReifyDemo

  ved-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Install Lean toolchain
      run: elan default $(cat lean-toolchain)

    - name: Strict axiom audit (accept / reject controls)
      run: lake build Tests.Ved.StrictAuditCheck

    - name: Synthesis-path regressions (width-aware merging, per-module caches)
      run: lake build Tests.Ved.RegDedupWidthCheck Tests.Ved.NestedCacheCheck

    - name: U1 strict entry (contract, entry, deep route; accept and refuse controls)
      run: lake build Tests.Ved.U1ContractCheck Tests.Ved.U1EntryCheck Tests.Ved.U1DeepCheck Tests.Ved.U1DomainCheck Tests.Ved.U1MultiOutCheck Tests.Ved.U1PackedCheck Tests.Ved.U1EqLutCheck Tests.Ved.U1StageCheck Tests.Ved.U1HierCheck Tests.Ved.U1MultiRegCheck Tests.Ved.DeepNameCheck Tests.Ved.DeepInitCheck Tests.Ved.DeepHygieneCheck Tests.Ved.U1LeafCheck

    - name: U1 on a real IP leaf (rconHW, representative, heavier)
      run: lake build Tests.Ved.U1RconCheck

    - name: H2 stateful hierarchy (semantics, open parent, H2a entry, H2b parent registers; accept and refuse controls)
      run: lake build Tests.Ved.U2HierSemCheck Tests.Ved.H2OpenParentProbe Tests.Ved.U2HierCheck Tests.Ved.U2HierRegCheck Tests.Ved.U2HierWireCheck Tests.Ved.U2HierPin

    - name: "H2c-state (a child call on the parent's register state): copies, controls"
      run: lake build Tests.Ved.U2HierStateCallCheck

    - name: "H2c-state: partial generation of the open parent's deep facts (recorded, or refused); controls"
      run: lake build Tests.Ved.U2HierPartialDeepCheck

    - name: "H2c-state: the ORIGINAL private declaration synth_httpGetByte (R223), the entry appended to its module"
      run: |
        lake build Tools.VedU2HierRegEntry IP.Net.HTTP
        sed -e 's/^import Sparkle$/import Sparkle\nimport Tools.VedU2HierRegEntry/' -e 's/^#synthesizeVerilog synth_httpGetByte$/#synthesizeVerilog synth_httpGetByte\nset_option maxRecDepth 100000\n#ved_u2_hier synth_httpGetByte/' Tests/IP/Net/HTTPTest.lean > "$RUNNER_TEMP/HTTPTestReal.lean"
        lake env lean "$RUNNER_TEMP/HTTPTestReal.lean" 2>&1 | tee "$RUNNER_TEMP/real.out"
        grep -q "VED U2 HIER OK" "$RUNNER_TEMP/real.out"

    - name: U1 on a real IP leaf (keccakRcHW, 32 x 64-bit constants)
      run: lake build Tests.Ved.U1KeccakRcCheck

    - name: U1 on real IP with == and wide inputs (aluSignal, hazardSignal, lqrCtrlTop, canopenIsNmt, droneCanNodeFilter)
      run: lake build Tests.Ved.U1EqWideCheck

    - name: "U1 on the real constant tables (SHA-256 / SHA-512 K, AES S-box: 64 / 80 / 256 entries)"
      run: lake build Tests.Ved.U1KTabCheck

    - name: "U1 on real IP with several Signal.loop registers: all 28 rows (4 parts + PR check) and refusal controls"
      run: lake build Tests.Ved.U1MultiLoopAll

    - name: Deep route, every regression file
      run: |
        lake build Tests.Verification.ValueParamInitRepro Tests.Verification.ConeSharingGen \
          Tests.Verification.DeepElabReifyDemo Tests.Verification.ConeSharingCrc16 \
          Tests.Verification.DeepElabRealIP
