name: VED (verify_elab_deep)

# Regression for `#verify_elab_deep` and the strict axiom audit
# (notes/ved/VED-MAIN-INTRO.md).  These lean_lib targets are NOT default targets, so the
# plain `lake build` of build.yml does not build them.
#
# * `ved-pr`   — the representative regression, on pull requests that touch
#   the compiler, the VED tools or their tests.
# * `ved-full` — every VED regression file, on a schedule and on demand
#   (the release / periodic gate; the per-IP release measurement is a
#   separate gate, see the doc).

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Sparkle.lean'
      - 'Sparkle/**'
      - 'Tools/DeepElab.lean'
      - 'Tools/VerifyElab.lean'
      - 'Tools/ConeFold*.lean'
      - 'Tools/ConcatNorm.lean'
      - 'Tools/SVParser/**'
      - 'Tools/VedStrictAudit.lean'
      - 'Tools/VedU1*.lean'
      - 'Tools/VedU2*.lean'
      - 'Tools/VedIRDecEq.lean'
      - 'Tests/Verification/**'
      - 'Tests/Ved/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/ved.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      set:
        description: 'which check set to run: full (ved-full) or pr (the ved-pr parts)'
        type: choice
        options: [ full, pr ]
        default: full

permissions:
  contents: read

jobs:
  # `ved-pr` and `ved-full` run as matrices of independent parts; every
  # original check target is in exactly one part, one `lake build` line per
  # original step.  `ved-pr` / `ved-full` (below) fail unless every part
  # succeeded.
  # Shared dependencies (`ved-deps`): the core library and the Tools modules
  # the checks import, built once and uploaded as an artifact of this run;
  # every part restores this .lake and builds only its check files (Lake
  # still checks every trace, so nothing stale is used).  ved-deps also
  # restores the .lake of an earlier ved-deps run from the Actions cache.
  # The parts are grouped by the measured time of each line (BuildAndCI.md
  # §5), so that no part is much longer than the longest single check.
  # `workflow_dispatch` with set=pr runs the ved-pr parts instead of ved-full.
  ved-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Install Lean toolchain
      run: elan default $(cat lean-toolchain)

    # Lake checks every trace after the restore, so a restored older .lake
    # only saves the modules whose inputs did not change.
    - name: Cache .lake (previous ved-deps builds)
      uses: actions/cache@v4
      with:
        path: .lake
        key: ved-deps-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ hashFiles('Sparkle.lean', 'Sparkle/**', 'Tools/**', 'IP/**') }}
        restore-keys: |
          ved-deps-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-

    - name: Core library
      run: lake build Sparkle

    - name: Tools modules imported by the checks
      run: lake build Tools.VedU1Entry Tools.VedU2HierRegEntry Tools.VedMemEntry Tools.VedU1Deep Tools.DeepElab Tools.VedU1ScriptSeqGen Tools.VedStrictAudit Tools.VedU1PackedEntry Tools.DeepFinArms Tools.VedMemPack Tools.VedWriteChecked Tools.VedU1HierEntry Tools.VedU2HierBudget Tools.VedComposeConnectGen Tools.VedU1StructOut Tools.VedInvocation Tools.VedMemLoop Tools.VedComposeStep Tools.VedU2HierMultiOut Tools.VedH3ChildTblEntry Tools.VedH3ChildEntry Tools.VedU2HierEntry Tools.VedMemWidth Tools.VedWriteForms Tools.VedU2HierProj Tools.VedMemOrder Tools.VedU1Contract Tools.VedSupplement

    - name: Pack .lake
      run: tar -cf - .lake | zstd -T0 -3 > "$RUNNER_TEMP/lake.tar.zst" && ls -l "$RUNNER_TEMP/lake.tar.zst"

    - name: Upload .lake
      uses: actions/upload-artifact@v4
      with:
        name: ved-deps-lake
        path: ${{ runner.temp }}/lake.tar.zst
        retention-days: 1
        compression-level: 0

  ved-pr-part:
    name: ved-pr (${{ matrix.part }})
    if: github.event_name == 'pull_request' || inputs.set == 'pr'
    needs: ved-deps
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: open-deep3
            builds: |
              Tests.Ved.U2HierOpenDeep3Check
          - part: compose
            builds: |
              Tests.Ved.ComposeStepCheck
              Tests.Ved.ComposeConnectCheck
          - part: multiloop-entry-a
            builds: |
              Tests.Ved.U1MultiLoopCheck
              Tests.Ved.U1ContractCheck Tests.Ved.U1EntryCheck Tests.Ved.U1DeepCheck Tests.Ved.U1DomainCheck Tests.Ved.U1MultiOutCheck Tests.Ved.U1StructOutCheck Tests.Ved.U1StructSeqCheck
          - part: mem-close
            builds: |
              Tests.Ved.VedMemCloseCheck
              Tests.Ved.VedCtrlAsyncCheck
              Tests.Ved.VedSharedRefsCheck Tests.Ved.VedSharedRefsEnvCheck
              Tests.Ved.U2HierStateCallCheck
          - part: open-deep2-h3
            builds: |
              Tests.Ved.U2HierOpenDeep2Check
              Tests.Ved.H3ChildCheck
          - part: multiout-partial
            builds: |
              Tests.Ved.MultiOutCheck
              Tests.Ved.U2HierPartialDeepCheck
          - part: entry-mem-small
            builds: |
              Tests.Ved.VedMemCheck Tests.Ved.VedMemWriteCheck Tests.Ved.VedMemShapeCheck Tests.Ved.VedMemOrderCheck Tests.Ved.VedMemWidthCheck
              Tests.Ved.StrictAuditCheck
              Tests.Ved.VedGetDKernelCheck
              Tests.Ved.VedOmegaCCheck
              Tests.Ved.VedOmegaCacheCheck Tests.Ved.VedSeqBoolsCheck
              Tests.Ved.RegDedupWidthCheck Tests.Ved.NestedCacheCheck
              Tests.Ved.U1CircuitLoopCheck
              Tests.Ved.U1SmallRegCheck
              Tests.Ved.VedBudgetCheck
              Tests.Ved.U1IirCheck
              Tests.Ved.U1RegChainCheck
              Tests.Ved.U1PackedSeq2Check
              Tests.Ved.U1PackedSeq3Check
          - part: seqmod-merkle
            builds: |
              Tests.Ved.U1SeqModCheck
              Tests.Ved.U1MerkleWhnfCheck
          - part: open-deep-pack
            builds: |
              Tests.Ved.U2HierOpenDeepCheck
              Tests.Ved.WriteFormsCheck
              Tests.Ved.WriteCheckedCheck
              Tests.Ved.VedMemPackCheck
              Tests.Ved.VedSupplementCheck
            http: true
          - part: entry-b-h2
            builds: |
              Tests.Ved.U1PackedCheck Tests.Ved.U1EqLutCheck Tests.Ved.U1StageCheck Tests.Ved.U1HierCheck Tests.Ved.U1MultiRegCheck Tests.Ved.DeepNameCheck Tests.Ved.DeepInitCheck Tests.Ved.DeepHygieneCheck Tests.Ved.U1LeafCheck
              Tests.Ved.U2HierSemCheck Tests.Ved.H2OpenParentProbe Tests.Ved.U2HierCheck Tests.Ved.U2HierRegCheck Tests.Ved.U2HierWireCheck Tests.Ved.U2HierPin
              Tests.Ved.U2HierMultiCheck
          - part: real-ip-deep
            builds: |
              Tests.Ved.U1KeccakRcCheck
              Tests.Ved.U1EqWideCheck
              Tests.Ved.U1KTabCheck
              Tests.Ved.U1RconCheck
              Tests.Verification.ValueParamInitRepro Tests.Verification.ConeSharingGen Tests.Verification.DeepElabReifyDemo
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Install Lean toolchain
      run: elan default $(cat lean-toolchain)

    - name: Download shared .lake
      uses: actions/download-artifact@v4
      with:
        name: ved-deps-lake
        path: ${{ runner.temp }}

    - name: Restore shared .lake
      run: zstd -dc "$RUNNER_TEMP/lake.tar.zst" | tar -xf -

    - name: Core library (restored; Lake re-checks it)
      run: lake build Sparkle

    - name: Checks of this part (one lake build per line)
      env:
        BUILDS: ${{ matrix.builds }}
      run: |
        set -euo pipefail
        while read -r line; do
          [ -n "$line" ] || continue
          echo "::group::lake build $line"
          start=$(date +%s)
          lake build $line
          echo "::endgroup::"
          echo "$(( $(date +%s) - start )) s  $line" | tee -a "$RUNNER_TEMP/times.txt"
        done <<< "$BUILDS"

    - name: "H2c-state: the ORIGINAL private declaration synth_httpGetByte (R223), the entry appended to its module"
      if: matrix.http
      run: |
        lake build Tools.VedU2HierRegEntry IP.Net.HTTP
        sed -e 's/^import Sparkle$/import Sparkle\nimport Tools.VedU2HierRegEntry/' -e 's/^#synthesizeVerilog synth_httpGetByte$/#synthesizeVerilog synth_httpGetByte\nset_option maxRecDepth 100000\n#ved_u2_hier synth_httpGetByte/' Tests/IP/Net/HTTPTest.lean > "$RUNNER_TEMP/HTTPTestReal.lean"
        lake env lean "$RUNNER_TEMP/HTTPTestReal.lean" 2>&1 | tee "$RUNNER_TEMP/real.out"
        grep -q "VED U2 HIER OK" "$RUNNER_TEMP/real.out"

    - name: Times
      if: always()
      run: |
        { echo "### ved-pr (${{ matrix.part }})"; echo '```'; cat "$RUNNER_TEMP/times.txt" 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  ved-pr:
    if: always() && (github.event_name == 'pull_request' || inputs.set == 'pr')
    needs: ved-pr-part
    runs-on: ubuntu-latest
    steps:
    - name: Every ved-pr part succeeded
      run: test "${{ needs.ved-pr-part.result }}" = success

  # `ved-full` runs as a matrix of independent parts, like `ved-pr`; every
  # original check target is in exactly one part.  `ved-full` (below) fails
  # unless every part succeeded.
  ved-full-part:
    name: ved-full (${{ matrix.part }})
    if: github.event_name != 'pull_request' && inputs.set != 'pr'
    needs: ved-deps
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: entry-a-h2
            builds: |
              Tests.Ved.U1ContractCheck Tests.Ved.U1EntryCheck Tests.Ved.U1DeepCheck Tests.Ved.U1DomainCheck Tests.Ved.U1MultiOutCheck Tests.Ved.U1StructOutCheck Tests.Ved.U1StructSeqCheck
              Tests.Ved.U2HierSemCheck Tests.Ved.H2OpenParentProbe Tests.Ved.U2HierCheck Tests.Ved.U2HierRegCheck Tests.Ved.U2HierWireCheck Tests.Ved.U2HierPin
              Tests.Ved.U2HierMultiCheck
          - part: entry-b
            builds: |
              Tests.Ved.U1PackedCheck Tests.Ved.U1EqLutCheck Tests.Ved.U1StageCheck Tests.Ved.U1HierCheck Tests.Ved.U1MultiRegCheck Tests.Ved.DeepNameCheck Tests.Ved.DeepInitCheck Tests.Ved.DeepHygieneCheck Tests.Ved.U1LeafCheck
          - part: entry-mem-small
            builds: |
              Tests.Ved.VedMemCheck Tests.Ved.VedMemWriteCheck Tests.Ved.VedMemShapeCheck Tests.Ved.VedMemOrderCheck Tests.Ved.VedMemWidthCheck
              Tests.Ved.StrictAuditCheck
              Tests.Ved.VedGetDKernelCheck
              Tests.Ved.VedOmegaCCheck
              Tests.Ved.VedOmegaCacheCheck Tests.Ved.VedSeqBoolsCheck
              Tests.Ved.RegDedupWidthCheck Tests.Ved.NestedCacheCheck
              Tests.Ved.U1CircuitLoopCheck
              Tests.Ved.U1SmallRegCheck
              Tests.Ved.VedBudgetCheck
              Tests.Ved.U1IirCheck
              Tests.Ved.U1RegChainCheck
              Tests.Ved.U1MultiSeqCheck
              Tests.Ved.U1PackedSeq2Check
              Tests.Ved.U1PackedSeq3Check
              Tests.Ved.InvocationCheck
          - part: packed-mem
            builds: |
              Tests.Ved.U1MerkleWhnfCheck
              Tests.Ved.U1SeqModCheck
              Tests.Ved.VedMemPackCheck
              Tests.Ved.VedSupplementCheck
              Tests.Ved.U1RconCheck
          - part: mem-close
            builds: |
              Tests.Ved.VedMemCloseCheck
              Tests.Ved.VedCtrlAsyncCheck
              Tests.Ved.VedSharedRefsCheck Tests.Ved.VedSharedRefsEnvCheck
              Tests.Ved.U2HierStateCallCheck
          - part: compose
            builds: |
              Tests.Ved.ComposeStepCheck
              Tests.Ved.ComposeConnectCheck
              Tests.Ved.ComposeDeadSlotCheck
              Tests.Ved.MultiOutCheck
              Tests.Ved.U2HierPartialDeepCheck
          - part: open-deep
            builds: |
              Tests.Ved.U2HierNestedInlineCheck
              Tests.Ved.U2HierOpenDeepCheck
              Tests.Ved.U2HierOpenDeep2Check
              Tests.Ved.WriteFormsCheck
              Tests.Ved.WriteCheckedCheck
            http: true
          - part: open-deep3-tables
            builds: |
              Tests.Ved.U2HierOpenDeep3Check
              Tests.Ved.U1KeccakRcCheck
              Tests.Ved.U1EqWideCheck
              Tests.Ved.U1KTabCheck
              Tests.Ved.H3ChildCheck
              Tests.Ved.U1UnsolvedCheck
              Tests.Ved.U1HeavyCheck
          - part: multiloop-all
            builds: |
              Tests.Ved.U1MultiLoopAll
          - part: seq-bip32
            builds: |
              Tests.Ved.U1SeqCheck
          - part: crc
            builds: |
              Tests.Ved.U1WireShareCheck
          - part: deep-all
            builds: |
              Tests.Verification.ValueParamInitRepro Tests.Verification.ConeSharingGen Tests.Verification.DeepElabReifyDemo Tests.Verification.ConeSharingCrc16 Tests.Verification.DeepElabRealIP
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Install Lean toolchain
      run: elan default $(cat lean-toolchain)

    - name: Download shared .lake
      uses: actions/download-artifact@v4
      with:
        name: ved-deps-lake
        path: ${{ runner.temp }}

    - name: Restore shared .lake
      run: zstd -dc "$RUNNER_TEMP/lake.tar.zst" | tar -xf -

    - name: Core library (restored; Lake re-checks it)
      run: lake build Sparkle

    - name: Checks of this part (one lake build per line)
      env:
        BUILDS: ${{ matrix.builds }}
      run: |
        set -euo pipefail
        while read -r line; do
          [ -n "$line" ] || continue
          echo "::group::lake build $line"
          start=$(date +%s)
          lake build $line
          echo "::endgroup::"
          echo "$(( $(date +%s) - start )) s  $line" | tee -a "$RUNNER_TEMP/times.txt"
        done <<< "$BUILDS"

    - name: "H2c-state: the ORIGINAL private declaration synth_httpGetByte (R223), the entry appended to its module"
      if: matrix.http
      run: |
        lake build Tools.VedU2HierRegEntry IP.Net.HTTP
        sed -e 's/^import Sparkle$/import Sparkle\nimport Tools.VedU2HierRegEntry/' -e 's/^#synthesizeVerilog synth_httpGetByte$/#synthesizeVerilog synth_httpGetByte\nset_option maxRecDepth 100000\n#ved_u2_hier synth_httpGetByte/' Tests/IP/Net/HTTPTest.lean > "$RUNNER_TEMP/HTTPTestReal.lean"
        lake env lean "$RUNNER_TEMP/HTTPTestReal.lean" 2>&1 | tee "$RUNNER_TEMP/real.out"
        grep -q "VED U2 HIER OK" "$RUNNER_TEMP/real.out"

    - name: Times
      if: always()
      run: |
        { echo "### ved-full (${{ matrix.part }})"; echo '```'; cat "$RUNNER_TEMP/times.txt" 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  ved-full:
    if: always() && github.event_name != 'pull_request' && inputs.set != 'pr'
    needs: ved-full-part
    runs-on: ubuntu-latest
    steps:
    - name: Every ved-full part succeeded
      run: test "${{ needs.ved-full-part.result }}" = success
