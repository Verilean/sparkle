name: VED (verify_elab_deep)

# Regression for `#verify_elab_deep` and the strict axiom audit
# (docs/VED-MAIN-INTRO.md).  These lean_lib targets are NOT default targets, so the
# plain `lake build` of build.yml does not build them.
#
# * `ved-pr`   — the representative regression, on pull requests that touch
#   the compiler, the VED tools or their tests.
# * `ved-full` — every VED regression file, on a schedule and on demand
#   (the release / periodic gate; the per-IP release measurement is a
#   separate gate, see the doc).

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Sparkle.lean'
      - 'Sparkle/**'
      - 'Tools/DeepElab.lean'
      - 'Tools/VerifyElab.lean'
      - 'Tools/ConeFold*.lean'
      - 'Tools/ConcatNorm.lean'
      - 'Tools/SVParser/**'
      - 'Tools/VedStrictAudit.lean'
      - 'Tools/VedU1*.lean'
      - 'Tools/VedIRDecEq.lean'
      - 'Tests/Verification/**'
      - 'Tests/Ved/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/ved.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ved-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Install Lean toolchain
      run: elan default $(cat lean-toolchain)

    - name: Strict axiom audit (accept / reject controls)
      run: lake build Tests.Ved.StrictAuditCheck

    - name: Synthesis-path regressions (width-aware merging, per-module caches)
      run: lake build Tests.Ved.RegDedupWidthCheck Tests.Ved.NestedCacheCheck

    - name: U1 strict entry (contract, entry, deep route; accept and refuse controls)
      run: lake build Tests.Ved.U1ContractCheck Tests.Ved.U1EntryCheck Tests.Ved.U1DeepCheck Tests.Ved.U1DomainCheck Tests.Ved.U1MultiOutCheck Tests.Ved.U1PackedCheck Tests.Ved.U1EqLutCheck Tests.Ved.U1StageCheck Tests.Ved.U1HierCheck Tests.Ved.U1MultiRegCheck Tests.Ved.DeepInitCheck Tests.Ved.DeepHygieneCheck

    - name: U1 on a real IP leaf (rconHW, representative, heavier)
      run: lake build Tests.Ved.U1RconCheck

    - name: Deep route, representative regression
      run: lake build Tests.Verification.ValueParamInitRepro Tests.Verification.ConeSharingGen Tests.Verification.DeepElabReifyDemo

  ved-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Install Lean toolchain
      run: elan default $(cat lean-toolchain)

    - name: Strict axiom audit (accept / reject controls)
      run: lake build Tests.Ved.StrictAuditCheck

    - name: Synthesis-path regressions (width-aware merging, per-module caches)
      run: lake build Tests.Ved.RegDedupWidthCheck Tests.Ved.NestedCacheCheck

    - name: U1 strict entry (contract, entry, deep route; accept and refuse controls)
      run: lake build Tests.Ved.U1ContractCheck Tests.Ved.U1EntryCheck Tests.Ved.U1DeepCheck Tests.Ved.U1DomainCheck Tests.Ved.U1MultiOutCheck Tests.Ved.U1PackedCheck Tests.Ved.U1EqLutCheck Tests.Ved.U1StageCheck Tests.Ved.U1HierCheck Tests.Ved.U1MultiRegCheck Tests.Ved.DeepInitCheck Tests.Ved.DeepHygieneCheck

    - name: U1 on a real IP leaf (rconHW, representative, heavier)
      run: lake build Tests.Ved.U1RconCheck

    - name: Deep route, every regression file
      run: |
        lake build Tests.Verification.ValueParamInitRepro Tests.Verification.ConeSharingGen \
          Tests.Verification.DeepElabReifyDemo Tests.Verification.ConeSharingCrc16 \
          Tests.Verification.DeepElabRealIP
